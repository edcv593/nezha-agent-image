name: Build Nezha Agent Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream version
        id: ver
        run: |
          V=$(curl -fsSL https://api.github.com/repos/nezhahq/agent/releases/latest | jq -r .tag_name)
          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "failed to resolve upstream version"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "upstream version: $V"

      - name: Download binaries for both architectures
        run: |
          V=${{ steps.ver.outputs.version }}
          for arch in amd64 arm64; do
            mkdir -p "/tmp/src-$arch" "build/$arch"
            curl -fsSL -o "/tmp/agent-$arch.tar.gz" \
              "https://github.com/nezhahq/agent/releases/download/${V}/nezha-agent_linux_${arch}.tar.gz"
            tar xzf "/tmp/agent-$arch.tar.gz" -C "/tmp/src-$arch"
            BIN=$(find "/tmp/src-$arch" -name 'nezha-agent' -type f | head -n1)
            if [ -z "$BIN" ]; then
              echo "binary not found for $arch"
              exit 1
            fi
            cp "$BIN" "build/$arch/nezha-agent"
            chmod +x "build/$arch/nezha-agent"
          done
          ls -la build/*/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
